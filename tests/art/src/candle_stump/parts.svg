<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" data-origin-u="32 61">
  <title>candle_stump: the art pipeline's test prop (not shipped art)</title>
  <desc>
    Silhouette first: a stump of wax that has burned down to a lopsided lip, one long drip that ran
    out over the edge and set in a bulb, a lumpy pool at its foot, a bent wick and a small flame.
    The drip breaks the outline, so it is a silhouette feature and not interior detail.
  </desc>
