  <path id="spines" data-z="5" data-pivot="60 10" data-bevel-u="2" data-tilt-deg="50"
    d="M38 15 L41 5 L45.5 11.5 Z M54.5 10.5 L58.5 1.5 L63.5 9 Z M71 11 L75.5 3 L79.5 12.5 Z"/>
  <path id="head" data-z="6" data-pivot="104 30" data-bevel-u="5"
