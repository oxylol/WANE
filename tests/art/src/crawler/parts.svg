<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 44" data-origin-u="64 40">
  <title>crawler: the art pipeline's wide, low test creature (not shipped art)</title>
  <desc>
    Silhouette first, and wide: 115 u across its legs and 38 u tall, the shape of a Soot-tick or a
    Gnawer, so the review's 64 px silhouette and its Pitch picture are judged on an asset that is
    not taller than it is wide. A domed carapace on four jointed, tapering legs (all behind the
    body, so only the knees and feet show, as the thigh of a near leg across the belly read as a
    plank), three bone spines that break the top line, a tucked head with a hooked mandible, and
    one eye tagged `emissive eye`, which the review lights as an eye and not as a fire.
  </desc>
