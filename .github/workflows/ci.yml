# WANE continuous integration. BUILD.md section 13, "Testing and CI".
# Every job runs headless with the Godot version pinned in .godot-version (ADR-0001).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (gdlint, gdformat, project rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements.txt
      - run: ci/lint.sh
      - run: python3 tools/ci/test_gd_coverage.py
      - run: python3 tools/ci/test_codemap.py
      # The art build (ADR-0023): CairoSVG needs libcairo2; the tests and the byte-identity check
      # of the committed renders (a render that differs from a fresh build was hand-edited or stale).
      - run: sudo apt-get install -y --no-install-recommends libcairo2
      - run: python3 tools/ci/test_artbuild.py
      - run: python3 tools/artbuild/build.py --check
      - run: python3 tools/ci/test_ink_layout.py

  test:
    name: test (compile, content, fixtures, unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Godot
        run: |
          godot="$(ci/setup_godot.sh linux | tail -n 1)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-build
      - name: Sweep core under UBSan and ASan (ADR-0022)
        run: ci/sanitize_native.sh
      # Quiet runs: a failure prints only the failing stage's own words and ends the log, instead
      # of sitting before a thousand lines of passing unit cases (the reports/ upload keeps the
      # full gdUnit4 output).
      - name: Headless tests, GDScript reference (native off)
        env:
          WANE_NATIVE: "off"
        run: ci/test.sh --quiet
      - name: Fixtures and parity with the native path on (same goldens, same hashes)
        env:
          WANE_NATIVE: "on"
        run: |
          ci/test.sh --quiet --stage compile --stage fixtures
          ci/unit.sh --quiet tests/unit/core/test_native_parity.gd
      - name: Ink and gouache render tests (xvfb, GL Compatibility, llvmpipe)
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          ci/render.sh
      - name: Core coverage (gate 85%)
        run: python3 tools/ci/gd_coverage.py --min 85
      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: reports/

  # The performance gate is two jobs so that a red one cannot hide the other (ADR-0020 Decision 14).
  # perf: the 5-minute zone 1 run (no tick above 20 ms) and the presentation (5.0 ms p99 of script
  # time, sprites 2.0 + VFX 2.0 + audio and UI 1.0, through game/main.tscn under Pitch lighting).
  # Both must be green. The GPU half (lighting, sprites, 60 fps on reference PC and Deck) needs a
  # GPU runner: PROGRESS.md, Blocked 2.
  perf:
    name: perf (zone 1 5-minute run and the presentation against the CPU budget)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          godot="$(ci/setup_godot.sh linux | tail -n 1)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-build
      - name: Zone 1 5-minute run
        run: ci/perf.sh --only zone
      - name: Presentation (frame bench)
        run: ci/perf.sh --only frame
      - name: Upload the perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: |
            reports/perf.txt
            reports/frame.txt

  # BUILD.md section 13: input + simulation step 99th percentile <= 3.0 ms in the stress room
  # (200 enemies, 40 procs), no tick above 20 ms; budgets in content/perf/budget.tres. The gated
  # workload is the spec's (a 39-proc chain per Taper hit, ADR-0020 Decision 15); the proc storm is
  # reported by the same bench and not gated. Blocking since ADR-0020 Decision 17: with the physics
  # sweep, the plain enemy ticks and the enemy query cells native this job measured p99 2.67 ms and
  # worst 3.89 ms (5.01 and 7.64 before) on the reference machine, a margin of 11%. If the CI
  # runner (slower than that machine) turns it red, Decision 17 says what to do next. The gate is the
  # least of 3 runs per tick; the report also lists what each run read alone (Decision 18).
  perf-stress:
    name: perf (stress room against the CPU budget)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          godot="$(ci/setup_godot.sh linux | tail -n 1)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-build
      - name: Stress room
        run: ci/perf.sh --only stress
      - name: Upload the stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-stress-report
          path: reports/perf.txt

  # The lighting pass's GPU half (docs/adr/0023): the baked room field and the shadow buffer against
  # their CPU twin, the lit shader against its numbers, every shader compiling, on GL Compatibility
  # under xvfb (llvmpipe). The renderer-free half is the unit suite (tests/unit/game/test_lighting.gd).
  lighting:
    name: lighting (GPU check under a virtual display)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          godot="$(ci/setup_godot.sh linux | tail -n 1)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - name: Install a virtual display and a software GL driver
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - uses: ./.github/actions/native-build
      # The review check (ci/lighting.sh) reads its pictures with Pillow, pinned with the art build.
      - run: python3 -m pip install --user "$(grep -i '^pillow' tools/requirements.txt)"
      - name: Lighting GPU check and art review
        run: ci/lighting.sh

  native-release:
    name: native release library (${{ matrix.os }})
    # The exported game loads the release build of the extension; every other job uses the debug
    # one. This builds the release one and runs the replay fixtures on it (ADR-0021).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Godot
        run: |
          godot="$(ci/setup_godot.sh ${{ matrix.platform }} | tail -n 1)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-build
        with:
          target: template_release
      - name: Run the fixtures on the release extension
        run: ci/native_release_check.sh

  determinism:
    name: replay determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    # Windows runs the whole unit stage twice (8 minutes each on its 2 processors) after a native
    # build; 20 minutes was never enough once the native build joined the job.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Godot
        run: |
          godot="$(ci/setup_godot.sh ${{ matrix.platform }} | tail -n 1)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-build
      # Quiet: a failure prints only the failing fixtures and unit cases, so the end of the log says
      # what broke (the full logs of a Windows run are thousands of lines). The time limits are
      # hang guards, not gates: the unit stage took 8 minutes of the default 10 on Windows.
      - name: Replay fixtures against the golden hashes, and the unit tests (native off)
        env:
          WANE_NATIVE: "off"
          TEST_TIME_LIMIT: "1800"
        run: ci/test.sh --quiet --stage compile --stage fixtures --stage unit --unit-time-limit 1500
      - name: The same, with the native path on (a desync here is a P0, ADR-0021)
        env:
          WANE_NATIVE: "on"
          TEST_TIME_LIMIT: "1800"
        run: ci/test.sh --quiet --stage compile --stage fixtures --stage unit --unit-time-limit 1500
