# WANE continuous integration. BUILD.md section 13, "Testing and CI".
# Every job runs headless with the Godot version pinned in .godot-version (ADR-0001).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (gdlint, gdformat, project rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements.txt
      - run: ci/lint.sh
      - run: python3 tools/ci/test_gd_coverage.py
      - run: python3 tools/ci/test_codemap.py

  test:
    name: test (compile, content, fixtures, unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Godot
        run: |
          godot="$(ci/setup_godot.sh linux | tail -n 1)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - name: Headless tests
        run: ci/test.sh
      - name: Core coverage (gate 85%)
        run: python3 tools/ci/gd_coverage.py --min 85
      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: reports/

  perf:
    name: perf (stress room, zone 1 loop and the presentation against the CPU budget)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          godot="$(ci/setup_godot.sh linux | tail -n 1)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      # BUILD.md section 13: input + simulation step 99th percentile <= 3.0 ms in the stress room
      # (200 enemies, 40 procs), no tick above 20 ms; budgets in content/perf/budget.tres. The GPU
      # half (lighting, sprites, 60 fps on reference PC and Deck) needs a GPU runner: PROGRESS.md.
      # The frame bench gates the presentation's script time (sprites 2.0 + VFX 2.0 + audio and UI
      # 1.0 = 5.0 ms at the 99th percentile) through game/main.tscn under Pitch lighting.
      - name: Stress room, zone 1 loop and presentation
        run: ci/perf.sh
      - name: Upload the perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: |
            reports/perf.txt
            reports/frame.txt

  determinism:
    name: replay determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Godot
        run: |
          godot="$(ci/setup_godot.sh ${{ matrix.platform }} | tail -n 1)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - name: Replay fixtures against the golden hashes, and the RNG and hash unit tests
        run: ci/test.sh --stage compile --stage fixtures --stage unit
