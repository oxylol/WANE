# WANE continuous integration. BUILD.md section 13, "Testing and CI".
# Every job runs headless with the Godot version pinned in .godot-version (ADR-0001).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (gdlint, gdformat, project rules)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements.txt
      - run: ci/lint.sh
      - run: python3 tools/ci/test_gd_coverage.py
      - run: python3 tools/ci/test_codemap.py

  test:
    name: test (compile, content, fixtures, unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Godot
        run: |
          godot="$(ci/setup_godot.sh linux | tail -n 1)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - name: Install SCons (pinned in tools/requirements.txt)
        run: pip install "$(grep -i '^SCons==' tools/requirements.txt)"
      - name: Cache godot-cpp and its build
        uses: actions/cache@v4
        with:
          path: |
            native/godot-cpp
            native/.sconsign.dblite
          key: godot-cpp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/.godot-cpp-version', 'ci/build_native.sh') }}
      - name: Build the native extension (ADR-0021)
        run: ci/build_native.sh
      - name: Headless tests, GDScript reference (native off)
        env:
          WANE_NATIVE: "off"
        run: ci/test.sh
      - name: Fixtures and parity with the native path on (same goldens, same hashes)
        env:
          WANE_NATIVE: "on"
        run: |
          ci/test.sh --stage compile --stage fixtures
          ci/unit.sh tests/unit/core/test_native_parity.gd
      - name: Core coverage (gate 85%)
        run: python3 tools/ci/gd_coverage.py --min 85
      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: reports/

  # The performance gate is two jobs so that a red one cannot hide the other (ADR-0020 Decision 14).
  # perf: the 5-minute zone 1 run (no tick above 20 ms) and the presentation (5.0 ms p99 of script
  # time, sprites 2.0 + VFX 2.0 + audio and UI 1.0, through game/main.tscn under Pitch lighting).
  # Both must be green. The GPU half (lighting, sprites, 60 fps on reference PC and Deck) needs a
  # GPU runner: PROGRESS.md, Blocked 2.
  perf:
    name: perf (zone 1 5-minute run and the presentation against the CPU budget)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          godot="$(ci/setup_godot.sh linux | tail -n 1)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - name: Install SCons (pinned in tools/requirements.txt)
        run: pip install "$(grep -i '^SCons==' tools/requirements.txt)"
      - name: Cache godot-cpp and its build
        uses: actions/cache@v4
        with:
          path: |
            native/godot-cpp
            native/.sconsign.dblite
          key: godot-cpp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/.godot-cpp-version', 'ci/build_native.sh') }}
      - name: Build the native extension (ADR-0021, ADR-0022: the sweep runs native)
        run: ci/build_native.sh
      - name: Zone 1 5-minute run
        run: ci/perf.sh --only zone
      - name: Presentation (frame bench)
        run: ci/perf.sh --only frame
      - name: Upload the perf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: |
            reports/perf.txt
            reports/frame.txt

  # BUILD.md section 13: input + simulation step 99th percentile <= 3.0 ms in the stress room
  # (200 enemies, 40 procs), no tick above 20 ms; budgets in content/perf/budget.tres. This gate
  # was red on GDScript alone (p99 about 9 ms, worst about 20 ms, ADR-0020 Decision 8); the physics
  # sweep now runs native (ADR-0022) and this job builds the extension. continue-on-error stays
  # until the measured p99 is green on CI hardware (PROGRESS.md, Feature flags with expiry); the
  # step's own log and the uploaded report still show FAIL lines.
  perf-stress:
    name: perf-stress (stress room, known red until the C++ decision)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          godot="$(ci/setup_godot.sh linux | tail -n 1)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - name: Install SCons (pinned in tools/requirements.txt)
        run: pip install "$(grep -i '^SCons==' tools/requirements.txt)"
      - name: Cache godot-cpp and its build
        uses: actions/cache@v4
        with:
          path: |
            native/godot-cpp
            native/.sconsign.dblite
          key: godot-cpp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/.godot-cpp-version', 'ci/build_native.sh') }}
      - name: Build the native extension (ADR-0021, ADR-0022: the sweep runs native)
        run: ci/build_native.sh
      - name: Stress room
        run: ci/perf.sh --only stress
      - name: Upload the stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-stress-report
          path: reports/perf.txt

  determinism:
    name: replay determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: macos-14
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Godot
        run: |
          godot="$(ci/setup_godot.sh ${{ matrix.platform }} | tail -n 1)"
          test -x "$godot"
          echo "GODOT=$godot" >> "$GITHUB_ENV"
      - name: Install SCons (pinned in tools/requirements.txt)
        run: pip install "$(grep -i '^SCons==' tools/requirements.txt)"
      - name: Cache godot-cpp and its build
        uses: actions/cache@v4
        with:
          path: |
            native/godot-cpp
            native/.sconsign.dblite
          key: godot-cpp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/.godot-cpp-version', 'ci/build_native.sh') }}
      - name: Build the native extension (ADR-0021)
        run: ci/build_native.sh
      - name: Replay fixtures against the golden hashes, and the RNG and hash unit tests (native off)
        env:
          WANE_NATIVE: "off"
        run: ci/test.sh --stage compile --stage fixtures --stage unit
      - name: The same, with the native path on (a desync here is a P0, ADR-0021)
        env:
          WANE_NATIVE: "on"
        run: ci/test.sh --stage compile --stage fixtures --stage unit
